# G2 holonomy model: fixed values and tuning ranges.
#
# Decided 2026-11-10 (choices made by me, ranges proposed by Claude and accepted). The
# protocol requires this file to be committed BEFORE the first tuning trial; after that,
# any change needs a dated note in notes/protocol.md.
#
# Read by experiments/g2_search.py: `fixed` sets rtvm.train_holonomy.HolonomyConfig
# directly; each of the 20 random-search trials draws one value per `search` entry, in
# the order written here, from numpy.random.default_rng(0) (rtvm.g2search.sample_trials).
#
# Design choices (2026-11-10):
#   * Corrupted cycles: the true cycle's path p closed with a different relation r' != r,
#     drawn uniformly and rejected while (h, r', t) is a training fact
#     (rtvm.holonomy_model.corrupt_closing). No path search is needed, and it teaches which
#     relation a path pattern supports, which is what the per-relation stratified V1 metric
#     measures. Known weakness: a uniform r' is often an easy (type-mismatched) negative.
#   * Single-fact term: self-adversarial NSSA on ||U_r psi_h - psi_t|| (the same loss
#     family as RotatE), 256 uniform head/tail negatives per positive, unfiltered, weight 1.
#     The balance against the cycle terms is searched through alpha1 and alpha2 (wide
#     ranges, below); a separate weight would be nearly redundant under Adam.
#
# Bound used for `margin` (checked numerically 2026-11-10): a rank-r Cayley rotation is the
# identity outside a 2r-dimensional subspace, so with 2 blocks a cycle closing a path of
# length L has ||H - I||_F <= sqrt(16 r (L + 1)): 5.66 for rank 1 and L = 1, 8.0 for rank 2,
# 11.3 for rank 4. A margin above the bound can never be met. (Haar-random dense rotations
# give about 16, but dense rotations are only ablation S10.)

fixed:
  num_negatives: 256        # single-fact term, uniform head/tail corruption (RotatE paper: 256 on FB15k-237)
  batch_size: 1024          # shared by every G2 model
  cycles_per_triple: 8      # protocol note 2026-11-07
  entity_init: 1.0          # ||psi|| about 1 at the start; entity norms are free to grow
  eval_every: 10            # protocol: evaluate on V1 every 10 epochs
  patience: 5               # protocol: stop after 5 evaluations without improvement
  max_epochs: 1000          # protocol cap
  tf32: true                # training only; evaluation is strict FP32 (protocol note 2026-11-07)

search:                     # 20 trials, random search, trial seed 0, model seed 0
  rank: {choice: [1, 2, 4]}                     # protocol note 2026-11-06
  lr: {log_uniform: [1.0e-4, 3.0e-3]}           # Adam
  rotation_init: {log_uniform: [0.005, 0.1]}    # std of U, V entries: 0.005 is near identity
                                                # (||U - I|| about 0.01); 0.1 is already about half
                                                # the rank-r bound; 0.3 would be saturated
  gamma: {choice: [3.0, 6.0, 9.0, 12.0]}        # single-fact NSSA margin (L2 distance)
  temperature: {choice: [0.5, 1.0]}             # self-adversarial temperature
  alpha1: {log_uniform: [0.01, 10.0]}           # weight of the true-cycle term
  alpha2: {log_uniform: [0.01, 10.0]}           # weight of the corrupted-cycle hinge
  margin: {uniform: [0.5, 4.0]}                 # hinge margin on ||H - I||_F; below the rank-1, L = 1 bound of 5.66
