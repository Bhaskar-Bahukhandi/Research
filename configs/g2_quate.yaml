# G2 QuatE baseline (secondary: S5 and S6 only, not part of the gate).
#
# Ranges first decided 2026-11-10. Model and training fixed by protocol note 2026-11-16, after the
# official-code check (notes/quate_check.md), before any QuatE trial: the official-code QuatE
# (rtvm.baselines.build_quate_official: score with relations normalised inside it, squared-modulus
# regularisers on raw parameters with one weight, relation init with the entity-count fan-in),
# trained as its official code trains it wherever that does not conflict with a rule shared by
# every G2 model (budget, batch 1,024, V1 metric, evaluation schedule, patience, 1,000-epoch cap,
# TF32 training with FP32 evaluation, 20 trials).
#
# Read by experiments/g2_search.py; trials are drawn as for configs/g2_holonomy.yaml.
# The V1 score of a trial is the grouped AUC of PyKEEN's score_hrt (protocol, Models).
# A fixed value given per dataset is resolved by rtvm.g2search.fixed_values.

model: quate_official

dim:                        # quaternion dimension (4 reals each); set by the budget, not tuned
  fb15k237: 34              # 2,004,912 parameters; budget 2.0M +- 5%
  wn18rr: 32                # 5,192,960; dim 34 would be 5,517,520 (+6%). Protocol note 2026-11-10 (WN18RR sizes).

fixed:
  num_negatives:            # official code: 10 (FB15k-237), 1 (WN18RR); note 2026-11-16
    fb15k237: 10
    wn18rr: 1
  batch_size: 1024          # shared by every G2 model
  filtered_negatives: true  # exact (ExactFilterer), Bernoulli head/tail; official code (note 2026-11-16)
  loss: bcewithlogits       # softplus of the signed score, mean over positives and negatives
  optimizer: adagrad        # official code (note 2026-11-16)
  eval_every: 10
  patience: 5
  max_epochs: 1000
  tf32: true                # training only; evaluation strict FP32

search:                     # 20 trials, random search, trial seed 0, model seed 0
  lr: {log_uniform: [0.02, 0.5]}                     # Adagrad; official 0.1
  regularizer_weight: {log_uniform: [1.0e-3, 1.0]}   # one weight for both regularisers; official 0.3 FB, 0.1 WN
