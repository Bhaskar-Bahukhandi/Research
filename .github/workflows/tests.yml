name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and the rest
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy networkx matplotlib pytest
      # Unimplemented exercises show as SKIPPED, so CI stays green while you work.
      # Real failures in implemented code turn it red.
      - run: pytest -rs
